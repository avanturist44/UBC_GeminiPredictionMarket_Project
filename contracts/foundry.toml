[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
allow_paths = ["../node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
build_info = true
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]

[fuzz]
runs = 256
